name: Linux CI and Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Test and package Linux (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build optimized Linux binary
        run: cargo build --release

      - name: Create Linux tarball and checksum
        shell: bash
        run: |
          set -euo pipefail

          package_name="job-crawler-linux-x86_64"
          staging_dir="dist/${package_name}"

          mkdir -p "${staging_dir}"
          install -m 0755 target/release/job-crawler "${staging_dir}/job-crawler"
          cp README.md LICENSE "${staging_dir}/"
          cp -R examples "${staging_dir}/examples"

          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"
          cd dist
          sha256sum "${package_name}.tar.gz" > "${package_name}.tar.gz.sha256"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: job-crawler-linux-x86_64
          path: |
            dist/job-crawler-linux-x86_64.tar.gz
            dist/job-crawler-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Linux package to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: job-crawler-linux-x86_64
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
