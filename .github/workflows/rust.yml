name: Rust CI and Build Packages

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

  package:
    name: Build ${{ matrix.os_name }} package
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: Linux
          - runner: windows-latest
            os_name: Windows
          - runner: macos-latest
            os_name: macOS

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build optimized binary
        run: cargo build --release

      - name: Create Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="job-crawler-${{ runner.os }}-${{ runner.arch }}"
          stage="dist/${package}"

          mkdir -p "$stage"
          install -m 0755 target/release/job-crawler "$stage/job-crawler"
          cp README.md LICENSE "$stage/"
          cp -R examples "$stage/examples"

          tar -czf "dist/${package}.tar.gz" -C dist "$package"
          cd dist
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Create Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "job-crawler-${{ runner.os }}-${{ runner.arch }}"
          $stage = Join-Path "dist" $package

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/job-crawler.exe" (Join-Path $stage "job-crawler.exe")
          Copy-Item "README.md", "LICENSE" $stage
          Copy-Item "examples" $stage -Recurse

          $archive = "dist/$package.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $package.zip" | Out-File -FilePath "$archive.sha256" -Encoding ascii

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: job-crawler-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: job-crawler-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
