[package]
name = "rust-job-crawler"
version = "0.1.0"
edition = "2021"
description = "Discover and crawl company career sites and job boards for keyword-matched job postings"
license = "MIT"

[[bin]]
name = "job-crawler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rusqlite = { version = "0.41", features = ["bundled"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
